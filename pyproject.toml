[project]
name = "shopkeeper-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nightrail9", email = "2385227304@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncmy>=0.2.16",
    "cryptography>=50.0.2",
    "elasticsearch[async]>=8,<9",
    "fastapi[standard]>=0.143.0",
    "greenlet>=3.5.6",
    "huggingface-hub>=1.33.0",
    "jieba>=0.42.1",
    "langchain>=1.4.4",
    "langchain-deepseek>=1.1.1",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "loguru>=0.7.3",
    "omegaconf>=2.4.0",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
shopkeeper-agent = "main:run"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "."

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
